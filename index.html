// ============================================
// 🌐 نظام اللغة: عربي / إنجليزي
// دالة t() عالمية (وليست محصورة داخل App) حتى تعمل بشكل صحيح
// داخل كل المكوّنات الفرعية الأخرى مثل LessonPlanDocument أيضاً
// ============================================
let currentLanguage = 'ar';
function t(text) {
  if (currentLanguage !== 'en') return text;
  if (typeof text !== 'string') return text;
  const key = text.replace(/\s+/g, ' ').trim();
  return TRANSLATIONS_EN[key] || text;
}

function App() {
  const [user] = useState({
    uid: 'local-session'
  });

  const [language, setLanguage] = useState(() => {
    try {
      return localStorage.getItem('uae_lesson_planner_lang') || 'ar';
    } catch (_) {
      return 'ar';
    }
  });

  // نُزامن المتغيّر العالمي مع حالة اللغة في كل مرة يُعاد فيها العرض،
  // حتى تعمل t() بشكل صحيح حتى داخل المكوّنات الفرعية المنفصلة
  currentLanguage = language;

  const toggleLanguage = () => {
    setLanguage(prev => {
      const next = prev === 'ar' ? 'en' : 'ar';
      try { localStorage.setItem('uae_lesson_planner_lang', next); } catch (_) {}
      return next;
    });
  };

  useEffect(() => {
    try {
      document.documentElement.setAttribute('dir', language === 'en' ? 'ltr' : 'rtl');
      document.documentElement.setAttribute('lang', language === 'en' ? 'en' : 'ar');
    } catch (_) {}
  }, [language]);

  // وظيفة ذكية لاستخلاص الدور المطلوب من الرابط (URL Query Parameter)
  const getRoleFromUrl = () => {
    if (typeof window !== 'undefined') {
      const params = new URLSearchParams(window.location.search);
      const roleParam = params.get('role');
      if (roleParam === 'teacher' || roleParam === 'supervisor' || roleParam === 'principal') {
        return roleParam;
      }
    }
    return 'teacher'; // الافتراضي الآمن عند فتح الرابط العام لأول مرة
  };
  const initialRole = getRoleFromUrl();
  const requestedAdminRole = initialRole === 'supervisor' || initialRole === 'principal' ? initialRole : null;
  // نبدأ دائماً بدور المعلم كافتراضي آمن؛ أدوار المشرف/المدير تتطلب كلمة مرور أولاً
  const startRole = requestedAdminRole ? 'teacher' : initialRole;
  const [currentUserRole, setCurrentUserRole] = useState(startRole);
  // نحاول استرجاع آخر اسم كتبه المعلم على هذا الجهاز، حتى لا يُضطر لكتابته من جديد
  // في كل مرة يفتح فيها الرابط (يبقى قابلاً للتعديل يدوياً في أي وقت)
  const getRememberedTeacherName = () => {
    try {
      return localStorage.getItem('uae_lesson_planner_teacher_name') || '';
    } catch (_) {
      return '';
    }
  };
  const [userProfile, setUserProfile] = useState({
    uid: startRole === 'teacher' ? 'teacher_local_1' : startRole,
    name: startRole === 'teacher' ? (getRememberedTeacherName() || 'أستاذ(ة) المادة') : startRole === 'supervisor' ? 'المشرف الأكاديمي المعتمد' : 'مدير المدرسة الموقر',
    email: `${startRole}@school.ae`,
    role: startRole
  });

  // نظام حماية دخول المشرف/المدير بكلمة مرور مشتركة
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [pendingRoleRequest, setPendingRoleRequest] = useState(requestedAdminRole);
  const [showPasswordModal, setShowPasswordModal] = useState(!!requestedAdminRole);
  const [passwordInput, setPasswordInput] = useState('');
  const [passwordError, setPasswordError] = useState('');
  const PREPARATIONS_STORAGE_KEY = 'uae_lesson_planner_preparations_v1';
  const loadStoredPreparations = () => {
    try {
      const raw = localStorage.getItem(PREPARATIONS_STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : null;
    } catch (_) {
      return null;
    }
  };
  const [preparations, setPreparations] = useState(() => loadStoredPreparations() || []);
  const [selectedPrepId, setSelectedPrepId] = useState(null);

  // ضبط التبويب الافتراضي تلقائياً بناءً على الدور القادم من الرابط
  const [activeTab, setActiveTab] = useState(startRole === 'teacher' ? 'planner' : 'archive');

  // فلاتر الأرشيف
  const [filterTeacher, setFilterTeacher] = useState('');
  const [filterSubject, setFilterSubject] = useState('');
  const [filterGrade, setFilterGrade] = useState('');
  const [filterStatus, setFilterStatus] = useState('');
  const [searchQuery, setSearchQuery] = useState('');
  const [currentPage, setCurrentPage] = useState(1);
  const itemsPerPage = 8;
  const [showDeleteModal, setShowDeleteModal] = useState(false);
  const [prepToDeleteId, setPrepToDeleteId] = useState(null);
  const [activePrep, setActivePrep] = useState(JSON.parse(JSON.stringify(EMPTY_PREPARATION)));
  const [isGenerating, setIsGenerating] = useState(false);
  const [userQuery, setUserQuery] = useState("");
  // 📎 ملف PDF اختياري (صفحات من الكتاب المدرسي) يُرفق مع طلب التوليد
  // حتى يقرأه الذكاء الاصطناعي فعلياً ويربط التحضير بمحتواه
  const [attachedPdf, setAttachedPdf] = useState(null); // { name, sizeLabel, base64, mimeType }
  const [pdfError, setPdfError] = useState("");
  // ⚠️ خوادم Vercel (المستضيف الحالي) تفرض حداً صارماً على حجم الطلب الواحد لا يمكن
  // تجاوزه بأي إعداد (4.5MB كحد أقصى شامل كل شيء). وبما أن ترميز الملف لإرساله
  // يكبّر حجمه ~37%، نضع حداً آمناً هنا يبقي الطلب كاملاً تحت هذا السقف الحقيقي.
  const MAX_PDF_MB = 2.5;

  const handlePdfSelected = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // يسمح باختيار نفس الملف مرة أخرى لاحقاً لو احتاج المعلم ذلك
    setPdfError("");
    if (!file) return;
    if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
      setPdfError(t("❌ الرجاء اختيار ملف بصيغة PDF فقط."));
      return;
    }
    const sizeMb = file.size / (1024 * 1024);
    if (sizeMb > MAX_PDF_MB) {
      setPdfError(t("❌ حجم الملف كبير جداً (الحد الأقصى") + ` ${MAX_PDF_MB}MB` + t(")، يرجى رفع صفحات الدرس المطلوب فقط بدل الكتاب كاملاً، أو ضغط الملف لتصغير حجمه أولاً."));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const base64 = String(reader.result).split(",")[1] || "";
        setAttachedPdf({
          name: file.name,
          sizeLabel: `${sizeMb.toFixed(1)}MB`,
          base64,
          mimeType: "application/pdf"
        });
        addLog(t("📎 تم إرفاق ملف:") + ` ${file.name} (${sizeMb.toFixed(1)}MB)`);
      } catch (err) {
        setPdfError(t("❌ تعذّرت قراءة الملف، حاول ملفاً آخر."));
      }
    };
    reader.onerror = () => setPdfError(t("❌ تعذّرت قراءة الملف، حاول ملفاً آخر."));
    reader.readAsDataURL(file);
  };

  const removeAttachedPdf = () => {
    setAttachedPdf(null);
    setPdfError("");
  };
  const [debugLog, setDebugLog] = useState([]);
  const addLog = msg => {
    const time = new Date().toLocaleTimeString('ar-EG', {
      hour12: false
    });
    setDebugLog(prev => [...prev.slice(-9), `[${time}] ${msg}`]);
  };
  const [notification, setNotification] = useState(null);
  const [authStatus, setAuthStatus] = useState("جاري الاتصال بالسحابة...");
  const [activityLogs, setActivityLogs] = useState([]);
  const [googleDriveLogs, setGoogleDriveLogs] = useState([]);

  // مراقبة وتحديث الدور وتغييرات الرابط
  useEffect(() => {
    const handleUrlRoleChange = () => {
      const roleFromUrl = getRoleFromUrl();
      if (roleFromUrl !== currentUserRole) {
        requestRoleSwitch(roleFromUrl);
      }
    };
    window.addEventListener('popstate', handleUrlRoleChange);
    return () => window.removeEventListener('popstate', handleUrlRoleChange);
  }, [currentUserRole, adminUnlocked]);

  // الاتصال بالسحابة (Firestore) إن كانت الإعدادات مُعبّأة، والاستماع اللحظي
  // لأي تحضير يُضاف/يُعدّل/يُحذف من أي جهاز آخر (معلم أو مشرف أو مدير)
  useEffect(() => {
    simulateDriveCreation();
    if (!cloudEnabled || !db) {
      setAuthStatus("⚠️ الوضع المحلي فقط (لم يتم ربط التخزين السحابي بعد - راجع تعليمات firebaseConfig)");
      return;
    }
    setAuthStatus("جاري الاتصال بالسحابة...");
    const unsubscribe = db.collection("preparations").orderBy("createdAt", "desc").onSnapshot(snapshot => {
      const docs = snapshot.docs.map(d => ({
        id: d.id,
        ...d.data()
      }));
      setPreparations(docs);
      setAuthStatus("متصل بالسحابة ✅ (كل تحضير يظهر فوراً لجميع الأجهزة)");
    }, err => {
      addLog(t("🔴 خطأ اتصال بالسحابة:") + ` ${err.message}`);
      setAuthStatus("⚠️ تعذّر الاتصال بالسحابة - تحقق من إعدادات firebaseConfig وقواعد Firestore");
    });
    return () => unsubscribe();
  }, []);

  // تحميل بيانات تجريبية أولية فقط في الوضع المحلي (بدون سحابة)، وفقط إذا لم
  // يكن هناك أي تحضيرات محفوظة سابقاً من المستخدم في هذا المتصفح
  useEffect(() => {
    if (cloudEnabled) return; // في الوضع السحابي، preparations تُحمّل من Firestore مباشرة
    setPreparations(prev => {
      if (prev.length > 0) return prev;
      const storedAlready = loadStoredPreparations();
      if (storedAlready && storedAlready.length > 0) return storedAlready;
      const initialDoc1 = {
        id: generateId(),
        ...JSON.parse(JSON.stringify(EMPTY_PREPARATION)),
        status: "تم التسليم",
        createdAt: new Date().toISOString(),

}`;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 150000);

      // نستخدم Promise.race كضمان إضافي: حتى لو لم يعمل الإلغاء عبر AbortController
      // لأي سبب، فإن هذا المؤقّت المستقل سيُفشل الطلب ويوقف حالة "جاري التوليد" حتماً
      const hardTimeout = new Promise((_, reject) => {
        setTimeout(() => reject(new Error("TIMEOUT_HARD")), 155000);
      });

      // توليد محتوى بهذا الحجم (14 قسماً) قد يستغرق فعلياً 30-90 ثانية،
      // فنُظهر نبضات تقدّم دورية حتى لا يبدو الأمر متوقفاً
      const progressPing = setInterval(() => {
        addLog(t("⏳ ما زال الذكاء الاصطناعي يعمل على توليد المحتوى..."));
      }, 12000);

      // بدل ما تنادي الصفحة Gemini مباشرة (وهذا كان يكشف المفتاح للجميع)،
      // صارت تنادي خادمنا الخاص فقط، وهو من يحمل المفتاح السري ويتصل بـ Gemini نيابة عنها.
      let response;
      try {
        response = await Promise.race([fetch(`/api/generate-prep`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          signal: controller.signal,
          body: JSON.stringify({
            userPrompt: `موضوع الدرس المطلوب تحضيره بالتفصيل، بحيث يخص هذا الموضوع تحديداً في كل حقل من حقول الـ JSON: "${userQuery.trim()}"`,
            systemPrompt,
            attachment: attachedPdf ? { base64: attachedPdf.base64, mimeType: attachedPdf.mimeType } : undefined
          })
        }), hardTimeout]);
      } finally {
        clearTimeout(timeoutId);
        clearInterval(progressPing);
      }
      if (!response.ok) {
        let detail = "";
        try {
          detail = (await response.json())?.error?.message || "";
        } catch (_) {}
        addLog(t("🔴 رد الخادم بخطأ:") + ` ${response.status} ${detail}`);
        throw new Error(`API Error: ${response.status}${detail ? " - " + detail : ""}`);
      }
      addLog(t("📩 وصل رد ناجح من الخادم، جاري تحليل المحتوى..."));
      const result = await response.json();
      const candidate = (result.candidates || [])[0];
      const rawText = (candidate?.content?.parts || []).map(part => part.text || "").join("");
      let cleanedText = rawText.replace(/```json|```/g, "").trim();
      // في حال وجود أي نص زائد قبل أو بعد الكائن JSON، نستخرج الجزء المحصور بين أول { وآخر }
      const firstBrace = cleanedText.indexOf("{");
      const lastBrace = cleanedText.lastIndexOf("}");
      if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
        cleanedText = cleanedText.slice(firstBrace, lastBrace + 1);
      }
      if (!cleanedText) {
        addLog(t("🔴 لا يوجد نص في الرد. سبب التوقف:") + ` ${candidate?.finishReason || t("غير معروف")}`);
        throw new Error("لم يتم توليد أي محتوى" + (candidate?.finishReason ? ` (${candidate.finishReason})` : ""));
      }
      if (candidate?.finishReason === "MAX_TOKENS") {
        throw new Error("انتهت المساحة المتاحة قبل اكتمال الخطة، حاول موضوعاً أقصر");
      }
      const generatedData = JSON.parse(cleanedText);
      addLog(t("✅ تم تحليل") + ` ${Object.keys(generatedData).length} ` + t("قسماً بنجاح، جاري التعبئة..."));
      setActivePrep(prev => ({
        ...prev,
        ...generatedData,
        basicInfo: {
          ...prev.basicInfo,
          ...(generatedData.basicInfo || {})
        }
      }));
      addLog(t("🎉 تم تعبئة التحضير بالكامل"));
      showToast(t("✅ تم توليد وتعبئة خطة الدرس بنجاح بالذكاء الاصطناعي!"));
      logActivity("توليد بالذكاء الاصطناعي", `توليد تحضير لدرس [${userQuery}]`, userProfile.name);
    } catch (error) {
      console.error(error);
      addLog(t("🔴 خطأ نهائي:") + ` ${error.message || error}`);
      if (error.name === "AbortError" || error.message === "TIMEOUT_HARD") {
        showToast(t("⏱️ استغرق الطلب وقتاً أطول من اللازم فتم إيقافه بعد 30 ثانية. جرّب موضوعاً أقصر أو أعد المحاولة."), "error");
      } else if (error instanceof SyntaxError) {
        showToast(t("❌ تعذر تحليل استجابة الذكاء الاصطناعي (قد تكون غير مكتملة). حاول موضوعاً أقصر أو أعد المحاولة."), "error");
      } else {
        showToast(t("❌ تعذر الاتصال بمحرك الذكاء الاصطناعي:") + ` ${error.message || t("خطأ غير معروف")}`, "error");
      }
    } finally {
      setIsGenerating(false);
    }
  };
  const getStatusColor = status => {
    switch (status) {
      case 'تم التسليم':
        return 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
      case 'تم التعديل':
        return 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30';
      case 'بانتظار المراجعة':
        return 'bg-blue-500/20 text-blue-400 border-blue-500/30';
      case 'لم يتم رفع التحضير':
        return 'bg-rose-500/20 text-rose-400 border-rose-500/30';
      default:
        return 'bg-slate-500/20 text-slate-400 border-slate-500/30';
    }
  };
  const getStatusDot = status => {
    switch (status) {
      case 'تم التسليم':
        return '🟢';
      case 'تم التعديل':
        return '🟡';
      case 'بانتظار المراجعة':
        return '🔵';
      case 'لم يتم رفع التحضير':
        return '🔴';
      default:
        return '⚪';
    }
  };
  const formatDate = dateString => {
    if (!dateString) return "غير متوفر";
    try {
      return new Date(dateString).toLocaleDateString('ar-AE', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    } catch {
      return dateString;
    }
  };
  return <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans selection:bg-amber-500 selection:text-slate-900" dir="rtl">
      
      {/* لوحة تشخيص عائمة ظاهرة دائماً بغض النظر عن الشاشة/الدور الحالي، لتتبع أي مشكلة فوراً */}
      {typeof document !== 'undefined' && ReactDOM.createPortal(<div style={{

          {debugLog.length === 0 ? <div style={{
        fontSize: '9px',

      }}>debug log — no events yet</div> : debugLog.map((line, i) => <div key={i} style={{
        fontSize: '9px',
        color: '#6ee7b7',
        fontFamily: 'monospace',
        lineHeight: 1.5,
        direction: 'rtl',
        textAlign: 'right'
      }}>{line}</div>)}
        </div>, document.body)}

      {notification && <div className={`fixed bottom-4 left-4 z-50 px-6 py-3.5 rounded-xl shadow-2xl border text-white transform transition-all duration-300 ${notification.type === 'success' ? 'bg-emerald-600 border-emerald-500' : 'bg-rose-600 border-rose-500'}`}>

        </div>}

      {/* الرأس الذكي المتغير حسب الصلاحيات */}

            <button onClick={() => requestRoleSwitch('supervisor')} className={`px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition-all ${currentUserRole === 'supervisor' ? 'bg-amber-500 text-slate-950 shadow' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>{t("👑 مشرف")}</button>
            <button onClick={() => requestRoleSwitch('principal')} className={`px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition-all ${currentUserRole === 'principal' ? 'bg-emerald-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>{t("🛡️ مدير")}</button>

          {/* الجانب الأيمن: بيانات المعلم ومساعد الذكاء الاصطناعي والمسودات */}

                  <input type="text" value={userProfile.name} onChange={e => {

      {/* ====================================================

(function () {
  try {
    var src = document.getElementById('app-source').textContent;
    var compiled = Babel.transform(src, {
      presets: [
        ["react", { runtime: "classic" }]
      ]
    }).code;
    var fn = new Function(compiled);
    fn();
  } catch (err) {
    console.error(err);
    var box = document.getElementById('boot-error');
    box.style.display = 'block';
    box.textContent = 'حدث خطأ أثناء تشغيل التطبيق:\n\n' + (err && err.stack ? err.stack : String(err));
    var root = document.getElementById('root');
    if (root) root.innerHTML = '';
  }
})();
</script>
</body>
</html>
